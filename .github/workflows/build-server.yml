name: Build Server
on:
  push:
    branches:
      - features
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: "🗝️ Docker Login: GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "🗝️ Docker Login: Docker Container Registry"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ::: Build and Push Image :::
      - name: Determine metadata
        run: |
          SHORT_COMMIT=$(echo $GITHUB_SHA | cut -c1-8)
          BUILD_INFO="dev-${SHORT_COMMIT}"
          BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "build_info=${BUILD_INFO}" >> $GITHUB_ENV
          echo "build_date=${BUILD_DATE}" >> $GITHUB_ENV
          
          echo "Build Info: ${BUILD_INFO}"
          echo "Build Date: ${BUILD_DATE}"

      - name: 🏷️ Get additional tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/lachee/szurubooru/server
            lachee/szurubooru-server
          flavor: |
            latest=true
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Szurubooru
            org.opencontainers.image.description=Szurubooru is an image board engine inspired by services such as Danbooru, Gelbooru and Moebooru dedicated for small and medium communities. 
            org.opencontainers.image.vendor=Lachee
            org.opencontainers.image.source=${{ github.repository }}
        env:
          # This is required for multi-architecture images to set metadata at both the index and manifest levels.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: 🐳 Build docker image
        uses: docker/build-push-action@v5
        with:
          context: server
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            BUILD_INFO=${{ env.build_info }}
            BUILD_DATE=${{ env.build_date }}
            SOURCE_COMMIT=$GITHUB_SHA
            DOCKER_REPO=lachee/szurubooru-server

